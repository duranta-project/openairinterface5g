//
// Wire-compatible protobuf mirror of e3sm_oai_l1_kpm.asn. Field numbers/types
// are the interop contract shared with the gNB's protobuf-c encoder
// (openair2/E3AP/service_models/l1_kpm_sm). proto2 for explicit presence and
// protobuf-c 1.4.x compatibility.

syntax = "proto2";

package e3sm.l1kpm.v1;

message L1KPMShmRef {
  optional bytes shm_name = 1;
  optional uint32 fh_buffer_index = 2;
  optional uint32 fh_write_index = 3;
}

message L1KPMIndication {
  optional L1KPMShmRef iq_samples_ref = 1;
  optional int64 timestamp = 2;
  optional uint32 sfn = 3;
  optional uint32 slot = 4;
  optional uint32 cell_id = 5;
  optional uint32 n_rx_ant = 6;
  optional uint32 valid_symbol_mask = 7;
}

message L1KPMRanFunctionData {
  optional bytes name = 1;
  optional uint32 version = 2;
  optional bytes description = 3;
}
