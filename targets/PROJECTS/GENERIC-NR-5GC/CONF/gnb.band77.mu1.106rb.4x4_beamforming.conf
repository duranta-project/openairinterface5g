Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID    =  0xe00;
    gNB_name  =  "gNB-OAI";
    tracking_area_code  =  40960;
    plmn_list = ({ mcc = 208; mnc = 95; mnc_length = 2; snssaiList = ({ sst = 1; }) });
    nr_cellid = 12345678L;
    min_rxtxtime = 4;
    # Pure single-stream analog beamforming (DOWNLINK only): ONE logical
    # (UE-facing) MIMO layer/antenna port. openair1/SCHED_NR/nr_ru_procedures.c
    # replicates that single stream's IQ across all 4 physical RF chains
    # (RUs.nb_tx/nb_rx below); the O-RU (ru.band77.mu1.106rb.4x4_beamforming.conf)
    # applies a distinct per-physical-antenna beam weight from its codebook
    # to that replicated stream. The UE stays 2Rx2Tx and just receives the
    # single beamformed stream with 2-antenna diversity.
    pdsch_AntennaPorts_XP = 1;
    pdsch_AntennaPorts_N1 = 1;
    maxMIMO_layers        = 1;
    # pusch_AntennaPorts is UPLINK-only and unrelated to the downlink
    # single-stream design above -- it declares how many RX antenna ports
    # the gNB itself combines over (drives Prx / common_vars.rxdataF sizing
    # in nr_init.c, and numSpatialStreamIndices in PUSCH/PUCCH decode), NOT
    # the UE's transmit rank (that's separately capped by
    # min(ue_supported_ul_layers(uecap), pusch_AntennaPorts) in
    # nr_radio_config.c, so a 2-antenna UE still only ever transmits rank
    # <=2 regardless of this value). Set to 4 to match RUs.nb_rx below --
    # left at 1 originally (mirroring the DL logical-layer count) this
    # silently limited the DU to combining only 1 of the 4 physical RX
    # antennas for ALL uplink reception (PUSCH channel estimation and PUCCH
    # format-0 SR/HARQ detection alike). PUSCH tolerated it (MCS0 + HARQ
    # retransmission), but PUCCH format 0's one-shot SR detection requires
    # >=10dB SNR (handle_nr_uci_pucch_0_1()) and single-antenna reception
    # never cleared that bar -- SR then exhausted sr_MaxTransmissions,
    # forcing a spec-mandated RA-with-existing-C-RNTI retry every time,
    # which a separate gap (F1AP UE Context Modification Required refused
    # because f1_ue_context_active was never set for this monolithic-mode
    # UE) turned into an unrecoverable RRCRelease loop. Raising this to 4
    # lets the gNB combine all 4 physical antennas for UL reception --
    # a conf-only fix, no source changes needed.
    pusch_AntennaPorts    = 4;
    do_CSIRS              = 0;
    do_SRS                = "none";
    sib1_tda              = 15;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;
      absoluteFrequencySSB                                          = 669984;
      dl_frequencyBand                                              = 77;
      dl_absoluteFrequencyPointA                                    = 668712;
      dl_offstToCarrier                                             = 0;
      dl_subcarrierSpacing                                          = 1;
      dl_carrierBandwidth                                           = 106;
      initialDLBWPlocationAndBandwidth                              = 28875;
      initialDLBWPsubcarrierSpacing                                 = 1;
      initialDLBWPcontrolResourceSetZero                            = 11;
      initialDLBWPsearchSpaceZero                                   = 0;
      ul_frequencyBand                                              = 77;
      ul_offstToCarrier                                             = 0;
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      pMax                                                          = 23;
      initialULBWPlocationAndBandwidth                              = 28875;
      initialULBWPsubcarrierSpacing                                 = 1;
      prach_ConfigurationIndex                                      = 157;
      prach_msg1_FDM                                                = 0;
      prach_msg1_FrequencyStart                                     = 0;
      zeroCorrelationZoneConfig                                     = 0;
      preambleReceivedTargetPower                                   = -100;
      preambleTransMax                                              = 7;
      powerRampingStep                                              = 2;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                  = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                     = 15;
      ra_ContentionResolutionTimer                                  = 7;
      rsrp_ThresholdSSB                                             = 19;
      prach_RootSequenceIndex_PR                                    = 2;
      prach_RootSequenceIndex                                       = 1;
      msg1_SubcarrierSpacing                                        = 1,
      restrictedSetConfig                                           = 0,
      msg3_DeltaPreamble                                            = 2;
      p0_NominalWithGrant                                           = -100;
      pucchGroupHopping                                             = 0;
      hoppingId                                                     = 0;
      p0_nominal                                                    = -96;
      ssb_PositionsInBurst_Bitmap                                   = 0x1;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;
      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 5;
      nrofDownlinkSlots                                             = 3;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 1;
      nrofUplinkSymbols                                             = 4;
      ssPBCH_BlockPower                                             = 0;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "127.0.0.1"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "127.0.0.1";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "127.0.0.1";
        GNB_PORT_FOR_S1U                         = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 200;
  pucch_TargetSNRx10          = 200;
  ul_bler_target_upper        = .35;
  ul_bler_target_lower        = .15;
  pusch_FailureThres          = 100;

  # Preconfigured analog beamforming: maps DL beam index to O-RU codebook
  # beam ID. Single-beam codebook only -- beam_weights must stay [0] and
  # the RU conf's codebook_nb_beams must stay 1 (selecting a second beam
  # via beam_weights=[1] crashed the DU; only one codebook entry is
  # supported until that's root-caused). The O-RU-side codebook_weights
  # matrix is RUs.nb_tx=4 physical tx chains x nb_fh_streams=4 with a
  # diagonal (per-antenna) weight, since all 4 eAxCs carry the same
  # replicated single-layer stream. See
  # ru.band77.mu1.106rb.4x4_beamforming.conf.
  set_analog_beamforming      = "lophy";
  beam_duration               = 1;
  beams_per_period            = 1;
  beam_weights                = [0];
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 110;
  pucch0_dtx_threshold = 80;
  pusch_dtx_threshold = -100;
  tx_amp_backoff_dB = 36;
  L1_rx_thread_core = 7; # pinned, disjoint from fhi_72's system/io/worker cores (4-6) and --thread-pool (9-29)
  L1_tx_thread_core = 8; # pinned, disjoint from fhi_72's system/io/worker cores (4-6) and --thread-pool (9-29)
  phase_compensation = 0;
}
);

RUs = (
{
  local_rf       = "no";
  nb_tx          = 4; # 4 physical RU RF chains -- UE stays 2Rx2Tx, see MACRLCs comment above
  nb_rx          = 4;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  # left unpinned (-1, i.e. omitted): pinning this collides with L1_rx/L1_tx
  # and re-creates the scheduler-starvation bug (see falcon-gh200 writeup §4)
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5";
  do_precoding   = 0;
}
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};

fhi_72 = {
  dpdk_devices = ("0002:01:02.2"); # DU VF (vf0) from sriov-falcon.sh
  dpdk_iova_mode = "VA";
  extra_eal_args = ("--file-prefix", "du"); # unique DPDK file-prefix so DU/RU DPDK primaries don't collide
  system_core = 4;
  io_core = 5;
  worker_cores = (6);
  ru_addr = ("02:00:00:00:00:02"); # RU VF (vf1) MAC from sriov-falcon.sh
  mtu = 9600;
  fh_config = ({
    T1a_cp_dl = (285, 470);
    T1a_cp_ul = (285, 470);
    T1a_up = (300, 450);
    Ta4 = (400, 440);
    Ta3_up = (200, 350);
    T2a_up = (300, 450);
    ru_config = {
      # Must be "dynamic" when iq_width < 16: O-RU sends per-section compression headers
      comp_hdr_type = "dynamic";
      iq_width = 16;
      iq_width_prach = 16;
    };
  });
};
