# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

# Two-beam O-RU conf (band 77, mu1, 106 RB, 4x4 beamforming), for step 6b of
# srs_aoa_integration.md: beam 0 = boresight, beam 1 = +15 deg -- matches the actual dynamic
# UE test path (0 deg <-> +15 deg), pair with gnb.band77.mu1.106rb.4x4_beamforming_aoa.conf.
# Steered weights are the empirically-validated ULA phase-steering codebook from
# beamform_static_demo.md sec 10a (Delta_phi(theta) = 360*(d/lambda)*sin(theta), d/lambda=0.5,
# applied as -Delta_phi*n per physical antenna n=0..3).

ORUs = (
{
  tx_bw = [106];
  rx_bw = [106];
  carrier_tx = [4049760];
  carrier_rx = [4049760];
  prach_config_index = 157;
  prach_msg1_start = 0;
  tdd_period = 5;
  num_dl_slots = 3;
  num_dl_symbols = 6;
  num_ul_slots = 1;
  num_ul_symbols = 4;
  numerology = 1;
  fronthaul = {
    dpdk_devices = ("0002:01:02.3"); # RU VF (vf1) from sriov-falcon.sh
    rx_core = 30;
    du_mac_addr = ("02:00:00:00:00:01"); # DU VF (vf0) MAC from sriov-falcon.sh
    mtu = 9216;
    # 400 us: hand each DL symbol to the radio earlier than the 285/300 us minimum, so the
    # vrtsim channel model in the O-RU write path finishes before air time
    T2a_up = (400, 3200);
    T2a_cp = (400, 3200);
    prach_eaxc_offset = 4;
    extra_eal_args = ("--file-prefix", "ru");
    comp_type = "none";
  }
  nb_fh_streams = 4;
  # Two-beam codebook under test: beam 0 = boresight, beam 1 = +15 deg.
  # MACRLCs.ssb_beams on the DU maps each transmitted SSB position to one of these indices.
  codebook_nb_beams = 2;
  # Q15 weights, layout: beam x nb_tx x fh_stream x (Re, Im); expected
  # element count = codebook_nb_beams * RUs.nb_tx * nb_fh_streams * 2 = 64.
  # The DU sends its single DL layer on fronthaul stream 0 (streams 1-3 carry zeros), so each
  # beam's steering vector sits in the stream-0 column: antenna n transmits w[beam][n][0] * stream 0.
  # Beam 0 (boresight): all four physical elements in phase, as in the validated single-beam conf.
  # Beam 1 (+15 deg): per-antenna phase step Delta_phi = 180*sin(15deg) = 46.587 deg,
  # applied as -Delta_phi*n (beamform_static_demo.md sec 10a):
  #   n=0: phase=0.000 deg    Re=32767  Im=0
  #   n=1: phase=-46.587 deg  Re=22519  Im=-23803
  #   n=2: phase=-93.175 deg  Re=-1815  Im=-32717
  #   n=3: phase=-139.762 deg Re=-25013 Im=-21166
  codebook_weights = [32767,0,      0,0, 0,0, 0,0,
                       32767,0,      0,0, 0,0, 0,0,
                       32767,0,      0,0, 0,0, 0,0,
                       32767,0,      0,0, 0,0, 0,0,

                       32767,0,      0,0, 0,0, 0,0,
                       22519,-23803, 0,0, 0,0, 0,0,
                       -1815,-32717, 0,0, 0,0, 0,0,
                       -25013,-21166, 0,0, 0,0, 0,0];
  # UL combine weights, same layout: one UL stream per antenna (stream n = conj(w[beam][n][n]) *
  # antenna n), so the DU's SRS-AoA estimator still sees each antenna's phase.
  ul_codebook_weights = [32767,0,     0,0,     0,0,     0,0,
                              0,0, 32767,0,     0,0,     0,0,
                              0,0,     0,0, 32767,0,     0,0,
                              0,0,     0,0,     0,0, 32767,0,

                          32767,0,     0,0,          0,0,          0,0,
                              0,0, 22519,-23803,     0,0,          0,0,
                              0,0,     0,0,      -1815,-32717,     0,0,
                              0,0,     0,0,          0,0,     -25013,-21166];
});

RUs = (
{
  local_rf       = "no";
  nb_tx          = 4; # 4 physical RU RF chains -- the O-RU codebook fans fronthaul stream 0 out to all 4
  nb_rx          = 4;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5"; # Activate FHI7.2
  do_precoding   = 0;
  # PRACH configuration
  num_tp_cores = 4;
  tp_cores = [31,32,33,34];
});

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};
