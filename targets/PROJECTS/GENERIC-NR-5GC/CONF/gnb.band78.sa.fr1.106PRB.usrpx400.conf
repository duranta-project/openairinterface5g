E3Configuration : {
  link        = "zmq";
  // Wire encoding for this run (BOTH builds): "json" or "asn1". One per
  // run; switching = edit + restart, no rebuild. JSON pairs with the aerial
  // dApps on the ports below; asn1 pairs with spear-dApp (defaults 9990s).
  encoding    = "json";
  transport   = "tcp";
  // SM IDs on the sensing branch (post-renumber):
  //   1 = Spectrum SM   (PRB-block + sensing-policy controls AND sensing_ranges telemetry)
  //   2 = L1-KPM SM (PHY IQ telemetry via /e3_ran_buffers; needed here — local_rf, no Aerial L1)
  /* Emit cadence is not configured here: each SM follows the periodicity the
   * subscribed dApps declare in their E3 subscription (0/unset = on-data, one
   * indication per publish). */

  // SM 2 (L1-KPM) serves the PHY IQ telemetry over /e3_ran_buffers that
  // the subcarrier-power dApps subscribe to (RF=2) — there is no Aerial L1
  // in this local_rf/USRP deployment, so OAI must provide it itself.
  enabled_sms = [1, 2];

  // JSON ports off the 5555/56/57 defaults to avoid colliding with NVIDIA cuBB (NVIDIA_L1 agent).
  // dApps must connect to OAI_L2 at these ports for JSON encoding.
  setup_port      = 7560;
  subscriber_port = 7562;
  publisher_port  = 7561;

};

THREAD_STRUCT = (
{
  #three config for level of parallelism "PARALLEL_SINGLE_THREAD", "PARALLEL_RU_L1_SPLIT", or "PARALLEL_RU_L1_TRX_SPLIT"
  parallel_config    = "PARALLEL_SINGLE_THREAD";
  #two option for worker "WORKER_DISABLE" or "WORKER_ENABLE"
  worker_config      = "WORKER_ENABLE";
}
);

rfsimulator :
{
  serveraddr = "server";
  serverport = "4043";
  options = (); #("saviq"); or/and "chanmod"
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};

