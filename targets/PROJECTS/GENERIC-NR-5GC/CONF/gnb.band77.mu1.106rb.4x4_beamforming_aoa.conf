Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

# AoA-driven 2-beam gNB conf (band 77, mu1, 106 RB, 4x4 beamforming), for step 6b of
# srs_aoa_integration.md: 2 SSB beams (0, +15 deg -- matches the actual dynamic UE test path),
# SRS-AoA enabled (do_SRS=periodic), CSI-RS/reconfiguration-driven beam switching (do_CSIRS=1),
# aoa_nb_beams=2 with explicit aoa_beam_angles so the DU selects the nearest configured beam
# angle instead of uniformly tiling [-90,90].
#
# SSB positions deliberately chosen as 0 and 2 (NOT 0 and 1): this band/numerology's default
# SSB timing (symbol_ssb_AC = {2,8,16,22,...}, 14 symbols/slot) puts positions 0 and 1 in the
# SAME slot (needing 2 concurrent beam allocations that slot), but position 2 lands in the next
# slot alone. Using 0+2 means no two active SSBs ever share a slot, so beams_per_period=1
# suffices -- avoiding a separate, pre-existing bug where beams_per_period>1 makes the DU
# silently exit(0) right after RU sync (reproduced even on the untouched single-beam baseline
# conf with nothing else changed; not yet root-caused, tracked as a follow-up).
#
# Pair with ru.band77.mu1.106rb.4x4_beamforming_2beam.conf.

gNBs =
(
 {
    gNB_ID    =  0xe00;
    gNB_name  =  "gNB-OAI";
    tracking_area_code  =  40960;
    plmn_list = ({ mcc = 208; mnc = 95; mnc_length = 2; snssaiList = ({ sst = 1; }) });
    nr_cellid = 12345678L;
    min_rxtxtime = 4;
    # Pure single-stream analog beamforming (DOWNLINK only): ONE logical MIMO layer, fanned out
    # to all 4 physical RF chains and steered by the O-RU codebook -- unchanged from the static
    # demo. What changes here is WHICH codebook beam that single stream rides on (0/+15 deg),
    # driven by SRS-AoA instead of being fixed at boresight.
    pdsch_AntennaPorts_XP = 1;
    pdsch_AntennaPorts_N1 = 1;
    maxMIMO_layers        = 1;
    pusch_AntennaPorts    = 4;
    do_CSIRS              = 1;
    do_SRS                = "periodic";
    sib1_tda              = 15;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;
      absoluteFrequencySSB                                          = 669984;
      dl_frequencyBand                                              = 77;
      dl_absoluteFrequencyPointA                                    = 668712;
      dl_offstToCarrier                                             = 0;
      dl_subcarrierSpacing                                          = 1;
      dl_carrierBandwidth                                           = 106;
      initialDLBWPlocationAndBandwidth                              = 28875;
      initialDLBWPsubcarrierSpacing                                 = 1;
      initialDLBWPcontrolResourceSetZero                            = 11;
      initialDLBWPsearchSpaceZero                                   = 0;
      ul_frequencyBand                                              = 77;
      ul_offstToCarrier                                             = 0;
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      pMax                                                          = 23;
      initialULBWPlocationAndBandwidth                              = 28875;
      initialULBWPsubcarrierSpacing                                 = 1;
      prach_ConfigurationIndex                                      = 157;
      prach_msg1_FDM                                                = 0;
      prach_msg1_FrequencyStart                                     = 0;
      zeroCorrelationZoneConfig                                     = 0;
      preambleReceivedTargetPower                                   = -100;
      preambleTransMax                                              = 7;
      powerRampingStep                                              = 2;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                  = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                     = 15;
      ra_ContentionResolutionTimer                                  = 7;
      rsrp_ThresholdSSB                                             = 19;
      prach_RootSequenceIndex_PR                                    = 2;
      prach_RootSequenceIndex                                       = 1;
      msg1_SubcarrierSpacing                                        = 1,
      restrictedSetConfig                                           = 0,
      msg3_DeltaPreamble                                            = 2;
      p0_NominalWithGrant                                           = -100;
      pucchGroupHopping                                             = 0;
      hoppingId                                                     = 0;
      p0_nominal                                                    = -96;
      # 2 active SSB positions: 0 and 2 (bits 0 and 2 = 0x5), NOT 0 and 1 -- see the file header
      # comment on why 1 is skipped (same-slot collision with 0). One per codebook beam; see
      # MACRLCs.ssb_beams below for the SSB-position -> codebook-beam-index mapping.
      ssb_PositionsInBurst_Bitmap                                   = 0x5;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;
      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 5;
      nrofDownlinkSlots                                             = 3;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 1;
      nrofUplinkSymbols                                             = 4;
      ssPBCH_BlockPower                                             = 0;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "127.0.0.1"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "127.0.0.1";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "127.0.0.1";
        GNB_PORT_FOR_S1U                         = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 200;
  pucch_TargetSNRx10          = 200;
  ul_bler_target_upper        = .35;
  ul_bler_target_lower        = .15;
  pusch_FailureThres          = 100;

  # Predefined beams with no digital beam table: beam IDs go to the O-RU, which maps each to a
  # codebook beam (fill_beam_index_list(): ssb_beams[i] is the codebook beam for the i-th ACTIVE
  # SSB position, in position order). 2 active SSB positions (0 and 2, see
  # ssb_PositionsInBurst_Bitmap above) -> 2 entries here, matching the 2-beam O-RU codebook
  # (index 0 = 0 deg boresight, index 1 = +15 deg -- see
  # ru.band77.mu1.106rb.4x4_beamforming_2beam.conf).
  bf_method                   = "predefined";
  beam_duration               = 1;
  # Concurrent beam slots for the MAC scheduler's own bookkeeping (beam_allocation_procedure).
  # Because active SSB positions 0 and 2 never land in the same slot (see file header comment),
  # only 1 concurrent beam allocation is ever needed at once -- keep this at 1. (A value >1 hits
  # a separate, pre-existing, not-yet-root-caused bug where the DU silently exit(0)s right after
  # RU sync, reproduced even on the untouched single-beam baseline conf.)
  beams_per_period            = 1;
  ssb_beams                   = [0, 1];

  # SRS-AoA-driven beam selection (openair2/LAYER2/NR_MAC_gNB/gNB_scheduler_primitives.c
  # aoa_selection_procedures()): 2 codebook beams, matching aoa_nb_beams to RUs' codebook_nb_beams.
  # aoa_beam_angles gives the actual pointing angle of each codebook beam index (same indexing as
  # ssb_beams above) so the DU picks the NEAREST configured angle to the SRS-estimated AoA,
  # instead of assuming beams are spread evenly across [-90,90].
  aoa_nb_beams                = 2;
  aoa_beam_angles             = [0, 15];

  # All 4 RU tx chains (nb_tx=4) map to the single logical DL antenna port (maxMIMO_layers=1) in
  # the FAPI spatialStreamIndices; the O-RU codebook fans that one stream out to the antennas.
  spatial_stream_index        = [0,0,0,0];
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 110;
  pucch0_dtx_threshold = 80;
  pusch_dtx_threshold = -100;
  tx_amp_backoff_dB = 36;
  L1_rx_thread_core = 7; # pinned, disjoint from fhi_72's system/io/worker cores (4-6) and --thread-pool (9-29)
  L1_tx_thread_core = 8; # pinned, disjoint from fhi_72's system/io/worker cores (4-6) and --thread-pool (9-29)
  phase_compensation = 0;
}
);

RUs = (
{
  local_rf       = "no";
  nb_tx          = 4; # 4 physical RU RF chains -- UE stays 2Rx2Tx, see MACRLCs comment above
  nb_rx          = 4;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5";
  do_precoding   = 0;
}
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};

fhi_72 = {
  dpdk_devices = ("0002:01:02.2"); # DU VF (vf0) from sriov-falcon.sh
  dpdk_iova_mode = "VA";
  extra_eal_args = ("--file-prefix", "du"); # unique DPDK file-prefix so DU/RU DPDK primaries don't collide
  system_core = 4;
  io_core = 5;
  worker_cores = (6);
  ru_addr = ("02:00:00:00:00:02"); # RU VF (vf1) MAC from sriov-falcon.sh
  mtu = 9600;
  fh_config = ({
    T1a_cp_dl = (285, 470);
    T1a_cp_ul = (285, 470);
    T1a_up = (300, 450);
    Ta4 = (400, 440);
    Ta3_up = (200, 350);
    T2a_up = (300, 450);
    ru_config = {
      # Must be "dynamic" when iq_width < 16: O-RU sends per-section compression headers
      comp_hdr_type = "dynamic";
      iq_width = 16;
      iq_width_prach = 16;
    };
  });
};
