# Transparent LEO satellite driven by an orbital trace (see doc/ntn-configuration.md).
# sat_trace_file is relative to the working directory (here: cmake_targets/).
# UE and gNB are both at the mid-pass subpoint of the sample trace.
channelmod = {
  max_chan=10;
  modellist="modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0"
      type           = "SAT_LEO_TRANS";
      noise_power_dB = -100;
      sat_trace_file = "../tools/ntn/data/orbital_trace_s_300.csv";
      pos_ue_x       = -3310204.0;
      pos_ue_y       = -5006785.1;
      pos_ue_z       = 2157610.7;
      pos_gnb_x      = -3310204.0;
      pos_gnb_y      = -5006785.1;
      pos_gnb_z      = 2157610.7;
    },
    {
      model_name     = "rfsimu_channel_ue0"
      type           = "SAT_LEO_TRANS";
      noise_power_dB = -100;
      sat_trace_file = "../tools/ntn/data/orbital_trace_s_300.csv";
      pos_ue_x       = -3310204.0;
      pos_ue_y       = -5006785.1;
      pos_ue_z       = 2157610.7;
      pos_gnb_x      = -3310204.0;
      pos_gnb_y      = -5006785.1;
      pos_gnb_z      = 2157610.7;
    }
  );
};
