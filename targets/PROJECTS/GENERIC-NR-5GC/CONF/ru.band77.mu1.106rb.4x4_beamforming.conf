# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

ORUs = (
{
  tx_bw = [106];
  rx_bw = [106];
  carrier_tx = [4049760];
  carrier_rx = [4049760];
  prach_config_index = 157;
  prach_msg1_start = 0;
  tdd_period = 5;
  num_dl_slots = 3;
  num_dl_symbols = 6;
  num_ul_slots = 1;
  num_ul_symbols = 4;
  numerology = 1;
  fronthaul = {
    dpdk_devices = ("0002:01:02.3"); # RU VF (vf1) from sriov-falcon.sh
    rx_core = 30;
    du_mac_addr = ("02:00:00:00:00:01"); # DU VF (vf0) MAC from sriov-falcon.sh
    mtu = 9216;
    T2a_up = (300, 3200);
    T2a_cp = (285, 3200);
    # must be >= max(nb_tx, nb_rx) = 4 for this 4-antenna config, not 2 (the
    # 2x2_catb value this was derived from) -- see the peafowl catb
    # writeup's PRACH eAxC offset bug: the DU auto-computes its own offset
    # as max(nb_tx,nb_rx)=4, and disagreeing with the RU here silently
    # misroutes PRACH C-Plane sections to the wrong aarx index (permanent
    # "RAR reception failed").
    prach_eaxc_offset = 4;
    extra_eal_args = ("--file-prefix", "ru");
    # IQ compression: "none", "bfp", "blkscale", "ulaw"
    # Must match iq_width setting on the O-DU side (fhi_72.fh_config.ru_config.iq_width)
    comp_type = "none";
  }
  # Pure single-stream analog beamforming: the DU transmits ONE logical
  # MIMO layer (gnb.band77.mu1.106rb.4x4_beamforming.conf's
  # maxMIMO_layers=1 / pdsch_AntennaPorts_XP=1 / pusch_AntennaPorts=1), and
  # openair1/SCHED_NR/nr_ru_procedures.c replicates that single stream's
  # baseband IQ across all RUs.nb_tx=4 physical tx chains before the
  # eCPRI/xran layer packages it -- one U-Plane flow per PHYSICAL antenna
  # still goes out over the wire (the DU-side xran library always packages
  # per RUs.nb_tx, it does not reduce eAxC count to match nb_fh_streams),
  # so this does NOT reduce fronthaul bandwidth vs. a multi-stream MIMO
  # codebook -- what changes is that all 4 eAxCs now carry the *same*
  # replicated content, and this codebook applies a distinct
  # per-physical-antenna weight (phase/amplitude, from the Cat-B code book)
  # to steer that single stream across the array. nb_fh_streams stays 4
  # (matching the real eAxC count the DU always sends) so the O-RU doesn't
  # drop the replicated antennas' streams as "exceeds nb_fh_streams" --
  # each physical antenna is sourced only from its own (now
  # content-identical) eAxC via the diagonal (tx_antenna == fh_stream)
  # weights below.
  nb_fh_streams = 4;
  # Single-beam codebook only: a second codebook entry
  # (MACRLCs.beam_weights=[1] on the DU) was tried and crashed the DU, so
  # this conf intentionally supports exactly one beam (index 0) --
  # codebook_nb_beams must stay 1 and MACRLCs.beam_weights on the DU side
  # must stay [0]. Do not add a second beam back without root-causing that
  # crash first.
  codebook_nb_beams = 1;
  # Q15 weights, layout: beam x nb_tx x fh_stream x (Re, Im); expected
  # element count = codebook_nb_beams * RUs.nb_tx * nb_fh_streams * 2 = 32.
  # All four physical elements in phase (boresight, no tilt). To point a
  # specific antenna's beam elsewhere, edit that antenna's (Re, Im) pair on
  # its own diagonal entry -- e.g. row/col (2,2) below is physical antenna
  # 2's weight.
  codebook_weights = [32767,0,     0,0,     0,0,     0,0,
                           0,0, 32767,0,     0,0,     0,0,
                           0,0,     0,0, 32767,0,     0,0,
                           0,0,     0,0,     0,0, 32767,0];
});

RUs = (
{
  local_rf       = "no";
  nb_tx          = 4; # 4 physical RU RF chains -- single fronthaul stream duplicated across all 4
  nb_rx          = 4;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5"; # Activate FHI7.2
  do_precoding   = 0;
  # PRACH configuration
  num_tp_cores = 4;
  tp_cores = [31,32,33,34];
});

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};
