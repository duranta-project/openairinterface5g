# OAI nr-oru for the OCUDU DU (ocudu.sa.band77.106prb.fhi72.1x1-oru.yaml).
# Template: envsubst writes the host values of ~/ocudu_env.sh into it, as in
# doc/running_ocudu_du_with_oai_in_7_2_split.md, section 8.

ORUs = (
{
  tx_bw = [106];
  rx_bw = [106];
  carrier_tx = [4049760];
  carrier_rx = [4049760];
  prach_config_index = 159;
  prach_msg1_start = 0;
  tdd_period = 5;
  num_dl_slots = 3;
  num_dl_symbols = 6;
  num_ul_slots = 1;
  num_ul_symbols = 4;
  numerology = 1;
  tx_core = ${ORU_TX};
  fronthaul = {
    dpdk_devices = ("${RU_VF}");
    rx_core = ${ORU_RX};
    north_cores = [${ORU_NORTH}];
    south_core = ${ORU_SOUTH};
    du_mac_addr = ("02:00:00:00:00:01");
    mtu = 9216;
    T2a_up = (250, 5000);
    T2a_cp = (250, 5000);
    prach_eaxc_offset = 1;
    extra_eal_args = ("--file-prefix", "ru");
    comp_type = "none";
    ul_comp_type = "none";
  }
});

RUs = (
{
  local_rf       = "no";
  nb_tx          = 1;
  nb_rx          = 1;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 10;
  tr_preference  = "raw_if4p5";
  do_precoding   = 0;
  num_tp_cores = 4;
  tp_cores = [${ORU_TP}];
});

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};
