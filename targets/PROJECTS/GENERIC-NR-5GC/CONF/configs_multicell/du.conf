#
# DU configuration for a 2-cell Aerial deployment.
# Pair with cu.conf on the CU side.
# Both cells are served by the same DU (one Aerial L1 instance, two cells).

Active_gNBs = ( "gNB-OAI" );
Asn1_verbosity = "none";

nfapi = "AERIAL";

gNBs =
(
  {
    ////////// Identification parameters — cell 0:
    gNB_ID    = 0xe00;
    gNB_DU_ID = 0xe00;
    gNB_name  = "gNB-OAI";

    tracking_area_code = 1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1; }) });
#    @include "neighbour-config.conf"
    nr_cellid = 0;

    ////////// Physical parameters:
    pdsch_AntennaPorts_XP = 2;
    pdsch_AntennaPorts_N1 = 2;
    pusch_AntennaPorts    = 4;
    do_CSIRS              = 1;
    do_SRS                = "none";
    min_rxtxtime          = 2;
    uess_agg_levels       = [0, 4, 2, 1, 0];

    servingCellConfigCommon = (
    {
      physCellId                                                  = 0;
      absoluteFrequencySSB                                        = 663360;
      dl_frequencyBand                                            = 77;
      dl_absoluteFrequencyPointA                                  = 660084;
      dl_offstToCarrier                                           = 0;
      dl_subcarrierSpacing                                        = 1;
      dl_carrierBandwidth                                         = 273;
      initialDLBWPlocationAndBandwidth                            = 1099;
      initialDLBWPsubcarrierSpacing                               = 1;
      initialDLBWPcontrolResourceSetZero                          = 12;
      initialDLBWPsearchSpaceZero                                 = 0;
      ul_frequencyBand                                            = 77;
      ul_offstToCarrier                                           = 0;
      ul_subcarrierSpacing                                        = 1;
      ul_carrierBandwidth                                         = 273;
      pMax                                                        = 20;
      initialULBWPlocationAndBandwidth                            = 1099;
      initialULBWPsubcarrierSpacing                               = 1;
      prach_ConfigurationIndex                                    = 159;
      prach_msg1_FDM                                              = 0;
      prach_msg1_FrequencyStart                                   = 0;
      zeroCorrelationZoneConfig                                   = 12;
      preambleReceivedTargetPower                                 = -96;
      preambleTransMax                                            = 6;
      powerRampingStep                                            = 1;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
      ra_ContentionResolutionTimer                                = 7;
      rsrp_ThresholdSSB                                           = 19;
      prach_RootSequenceIndex_PR                                  = 2;
      prach_RootSequenceIndex                                     = 1;
      msg1_SubcarrierSpacing                                      = 1,
      restrictedSetConfig                                         = 0,
      msg3_DeltaPreamble                                          = 1;
      p0_NominalWithGrant                                         = -90;
      pucchGroupHopping                                           = 0;
      hoppingId                                                   = 40;
      p0_nominal                                                  = -90;
      ssb_PositionsInBurst_Bitmap                                 = 1;
      ssb_periodicityServingCell                                  = 2;
      dmrs_TypeA_Position                                         = 0;
      subcarrierSpacing                                           = 1;
      referenceSubcarrierSpacing                                  = 1;
      dl_UL_TransmissionPeriodicity                               = 6;
      nrofDownlinkSlots                                           = 6;
      nrofDownlinkSymbols                                         = 10;
      nrofUplinkSlots                                             = 3;
      nrofUplinkSymbols                                           = 0;
      ssPBCH_BlockPower                                           = -15;
    }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };
  },
  {
    ////////// Identification parameters — cell 1:
    gNB_ID    = 0xe00;
    gNB_DU_ID = 0xe00;
    gNB_name  = "gNB-OAI";

    tracking_area_code = 1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1; }); });
 #   @include "neighbour-config.conf"
