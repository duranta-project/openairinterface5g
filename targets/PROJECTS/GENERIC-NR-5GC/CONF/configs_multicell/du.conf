);

MACRLCs = (
  {
    // Cell 0 — Aerial L1, F1 northbound to CU
    tr_s_preference  = "aerial";
    tr_s_shm_prefix  = "nvipc";
    local_s_portc    = 50001; // vnf p5 port
    local_s_portd    = 50011; // vnf p7 port

    tr_n_preference  = "f1";
    local_n_address  = "127.0.0.2"; // DU IP on the F1 interface
    remote_n_address = "127.0.0.1"; // CU IP on the F1 interface — adjust to CU address
    local_n_portd    = 2153;
    remote_n_portd   = 2153;

    pusch_FailureThres         = 10;
    pusch_TargetSNRx10         = 200;
    pucch_TargetSNRx10         = 200;
    ulsch_max_frame_inactivity = 10;
    dl_max_mcs                 = 27;
    ul_max_mcs                 = 27;
  },
  {
    // Cell 1 — same DU, same F1 connection
    tr_n_preference  = "f1";
    local_n_address  = "127.0.0.2"; // DU IP on the F1 interface
    remote_n_address = "127.0.0.1"; // CU IP on the F1 interface — adjust to CU address
    local_n_portd    = 2153;
    remote_n_portd   = 2153;

    pusch_FailureThres         = 10;
    pusch_TargetSNRx10         = 280;
    pucch_TargetSNRx10         = 200;
    ulsch_max_frame_inactivity = 10;
    dl_max_mcs                 = 27;
    ul_max_mcs                 = 27;
  }
);

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  f1ap_log_level   = "info";
};
