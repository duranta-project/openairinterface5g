#
# CU configuration for a 2-cell Aerial DU deployment.
# Pair with du.conf on the DU side.

Active_gNBs = ( "gNB-OAI" );
Asn1_verbosity = "none";

gNBs =
(
  {
    ////////// Identification parameters:
    gNB_ID   = 0xe00;
    gNB_name = "gNB-OAI";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code = 1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1; }) });
    nr_cellid = 0;

    ////////// F1 southbound (towards DU):
    tr_s_preference  = "f1";
    local_s_address  = "127.0.0.1"; // CU IP on the F1 interface
    remote_s_address = "0.0.0.0";     // DU initiates F1 Setup; not used for binding
    local_s_portd    = 2153;
    remote_s_portd   = 2153;
    @include "neighbour-config.conf"
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "172.21.6.195"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF = "172.21.8.120";
        GNB_IPV4_ADDRESS_FOR_NGU    = "172.21.8.120";
        GNB_PORT_FOR_S1U            = 2152;
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};
