# CU-CP of gNB-1 (gNB_ID 0xb00, PCI 1) in the rfsim Xn HO pipeline

Active_gNBs = ( "cu-cp-1");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xb00;
    gNB_name  =  "cu-cp-1";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0xffffff }) });
    @include "neighbour-config.conf"

    nr_cellid = 1;

    tr_s_preference = "f1";

    local_s_address  = "192.168.71.180";
    remote_s_address = "192.168.71.182";
    local_s_portd    = 2153;
    remote_s_portd   = 2153;

    # ------- SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.71.132"; });

    E1_INTERFACE =
    (
      {
        type      = "cp";
        ipv4_cucp = "192.168.71.180";
        port_cucp = 38462;
        ipv4_cuup = "0.0.0.0"; # multiple CU-UPs
        port_cuup = 38462;
      }
    )

    ////////// Xn parameters:
    Xn_INTERFACE :
    {
      gnb_ipv4_address_for_xnc = "192.168.71.180";
      candidate_gnb_ipv4_address_for_xnc = ( { ip = "192.168.71.150"; } ); # gNB-0
    };

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.71.180";
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config : {
  global_log_level = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "info";
  xnap_log_level   = "info";
};
