# CU-UP of gNB-1 (gNB_ID 0xb00) in the rfsim Xn HO pipeline

Active_gNBs = ( "cu-up-1");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xb00;
    gNB_CU_UP_ID = 0xb00;

#     cell_type =  "CELL_MACRO_GNB";

    gNB_name  =  "cu-up-1";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0xffffff }) });


    tr_s_preference = "f1";

    local_s_address = "192.168.71.181";
    remote_s_address = "192.168.71.182";
    local_s_portd   = 2153;
    remote_s_portd  = 2153;

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    E1_INTERFACE =
    (
      {
        type = "up";
        ipv4_cucp = "192.168.71.180";
        ipv4_cuup = "192.168.71.181";
      }
    )

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.71.181/24";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.71.181/24";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

log_config : {
  global_log_level = "info";
  pdcp_log_level   = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "info";
};
