      nrofDownlinkSlots                                             = 3;
      nrofDownlinkSymbols                                           = 10;
      nrofUplinkSlots                                               = 1;
      nrofUplinkSymbols                                             = 2;

  ssPBCH_BlockPower                                                 = -11;
  }

  );

  # ------- SCTP definitions
  SCTP :
  {
    # Number of streams to use in input/output
    SCTP_INSTREAMS  = 2;
    SCTP_OUTSTREAMS = 2;
  };
}
);

