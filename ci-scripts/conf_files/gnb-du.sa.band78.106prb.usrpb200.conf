      nrofDownlinkSymbols                                           = 10;
      nrofUplinkSlots                                               = 1;
      nrofUplinkSymbols                                             = 2;

      ssPBCH_BlockPower                                             = -25;
     }

  );

    bwp_list = (
      { scs = 1; bwpStart = 0; bwpSize = 36; bwpId = 2;},
      { scs = 1; bwpStart = 40; bwpSize = 50; bwpId = 3;}
    );

