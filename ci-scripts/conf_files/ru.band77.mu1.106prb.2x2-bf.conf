ORUs = (
{
  tx_bw = [106];
  rx_bw = [106];
  carrier_tx = [4049760];
  carrier_rx = [4049760];
  prach_config_index = 152;
  prach_msg1_start = 0;
  tdd_period = 5;
  num_dl_slots = 3;
  num_dl_symbols = 6;
  num_ul_slots = 1;
  num_ul_symbols = 4;
  numerology = 1;
  fronthaul = {
    dpdk_devices = ("0000:01:01.0"); # one VF can be used as well
    rx_core = 2;
    du_mac_addr = ("00:11:22:33:aa:66");
    mtu = 9216;
    T2a_up = (250, 5000);
    T2a_cp = (250, 5000);
    prach_eaxc_offset = 1;
    extra_eal_args = ("--file-prefix", "ru");
  }
  # Digital codebook beamforming (Cat-B): O-RU applies the codebook to DL
  # transmit and UL Rx combining (the C-plane section beamId selects the beam).
  # 2 RX antennas combined into 1 fh stream: out = w0*X0 + w1*X1 per beam.
  nb_fh_streams = 1;
  codebook_nb_beams = 2;
  # Q15 weights, layout: beam x tx_antenna x fh_stream x (Re, Im)
  codebook_weights = [32767,0, 32767,0,
                       32767,0, 0,32767];
});

RUs = (
{
  local_rf       = "no";
  # Physical antennas: 2 TX / 2 RX. The FH to the DU carries nb_fh_streams=1
  # stream each way (the O-DU side is configured 1x1).
  nb_tx          = 2;
  nb_rx          = 2;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 10;
  tr_preference  = "raw_if4p5"; # important: activate FHI7.2
  do_precoding   = 0; # needs to match O-RU configuration
  # PRACH configuration
  num_tp_cores = 4;
  tp_cores = [-1,-1,-1,-1];
});


log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};

# Chanmod required for proper mixing of O-RU antennas
channelmod = {
  max_chan = 10;
  modellist = "DefaultChannelList";
  DefaultChannelList = (
    {
      model_name     = "server_tx_channel_model";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -100;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};
