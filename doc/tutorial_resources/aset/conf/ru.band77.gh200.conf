# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

ORUs = (
{
  tx_bw = [106];
  rx_bw = [106];
  carrier_tx = [4049760];
  carrier_rx = [4049760];
  prach_config_index = 157;
  prach_msg1_start = 0;
  tdd_period = 5;
  num_dl_slots = 3;
  num_dl_symbols = 6;
  num_ul_slots = 1;
  num_ul_symbols = 4;
  numerology = 1;
  # Parallel DL OFDM readers (one north_core each).
  num_dl_threads = 2;
  tx_core = 19; # south write
  fronthaul = {
    # O-RU U/C VFs on aerial00 (same PF as gNB): VF2/VF3 — confirm after setup_ru_ifs-gh200.sh
    # UE behind RU via vrtsim. This config is for the OAI built-in-L1 DU on VF0/VF1, which
    # sends untagged frames and relies on VF hardware port-VLANs.
    dpdk_devices = ("0000:01:00.5", "0000:01:00.6");
    rx_core = 20;
    # One core per num_dl_threads. Must stay off UL Tpool / vrtsim (28-31).
    north_core = [21, 22];
    south_core = 23;
    ul_worker_cores = [24, 25, 26, 27];
    # du_mac_addr = OAI DU VF0/VF1 MAC from setup_ru_ifs-gh200.sh.
    du_mac_addr = ("02:00:00:00:00:0a", "02:00:00:00:00:0a");
    # Keep mtu <= 9582 (9600-18): stock libxran MBUF_POOL_ELEMENT is MAX_RX_LEN+HEADROOM;
    # mlx5 needs max_rx_pkt_len+headroom to fit or RX queue init panics. 8192 matches Aerial ASET.
    mtu = 8192;
    T2a_up = (350, 1200);
    T2a_cp = (285, 1200);
    # PRACH eAxC follows the nb_tx data streams below.
    prach_eaxc_offset = 2;
    extra_eal_args = ("--file-prefix", "ru");
  }
});

RUs = (
{
  local_rf       = "no";
  nb_tx          = 2;

  nb_rx          = 2;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5"; # important: activate FHI7.2
  do_precoding   = 0; # needs to match O-RU configuration
  # Fallback UL Tpool if fronthaul.ul_worker_cores is empty; keep disjoint from north/south.
  num_tp_cores   = 4;
  tp_cores       = [24, 25, 26, 27];
});


log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  ngap_log_level   = "info";
  f1ap_log_level   = "info";
};

# Required when --vrtsim.chanmod 1 (model name must be server_tx_channel_model)
# vrtsim AWGN uses channelmod.noise_power_dBFS (not per-model noise_power_dB).
# With tx_amp_backoff ≈ 36 dB: -61 gave ~19 dB SNR; -67 targets ~25 dB.
channelmod = {
  max_chan = 10;
  noise_power_dBFS = -67;
  modellist = "DefaultChannelList";
  DefaultChannelList = (
    {
      model_name     = "server_tx_channel_model";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -50;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};
