# DGX Spark built-in OAI L1 + FHI 7.2 DU.
@include "gnb.sa.band78.gh200.common.conf"

MACRLCs = (
{
  num_cc = 1;
  tr_s_preference = "local_L1";
  tr_n_preference = "local_RRC";
  pusch_TargetSNRx10 = 200;
  pucch_TargetSNRx10 = 200;
  ul_bler_target_upper = .35;
  ul_bler_target_lower = .15;
  pusch_FailureThres = 100;
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 110;
  pucch0_dtx_threshold = 80;
  pusch_dtx_threshold = -100;
  tx_amp_backoff_dB = 36;
  L1_rx_thread_core = 4;
  L1_tx_thread_core = 5;
  phase_compensation = 0;
}
);

RUs = (
{
  local_rf = "no";
  nb_tx = 2;
  nb_rx = 2;
  att_tx = 0;
  att_rx = 0;
  bands = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain = 75;
  sf_extension = 0;
  eNB_instances = [0];
  ru_thread_core = 3;
  sl_ahead = 5;
  tr_preference = "raw_if4p5";
  do_precoding = 0;
}
);

fhi_72 = {
  # VF0/VF1 on aerial00. Port 1 occupies 0000:01:00.1, so these start at .2.
  dpdk_devices = ("0000:01:00.2", "0000:01:00.3");
  system_core = 0;
  io_core = 1;
  worker_cores = (2);
  ru_addr = ("02:00:00:00:00:7b", "02:00:00:00:00:7b");
  file_prefix = "gnb";
  mtu = 8192;
  fh_config = ({
    T1a_cp_dl = (285, 470);
    T1a_cp_ul = (285, 429);
    T1a_up = (300, 450);
    Ta4 = (400, 440);
    ru_config = {
      iq_width = 16;
      iq_width_prach = 16;
    };
  });
};
