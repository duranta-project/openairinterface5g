# Built-in OAI L1 + FHI 7.2 DU — 4TR geometry (docker-compose.4TR.yml).
# Cell / AMF / security / log live in the shared 4TR common include.

@include "gnb.sa.band77.gh200.common.4TR.conf"

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 200;
  pucch_TargetSNRx10          = 200;
 # dl_bler_target_upper        = .35;
 # dl_bler_target_lower        = .15;
  ul_bler_target_upper        = .35;
  ul_bler_target_lower        = .15;
  pusch_FailureThres          = 100;
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 110;
  pucch0_dtx_threshold = 80;
  pusch_dtx_threshold = -100;
 # thread_pool_size = 8;
  tx_amp_backoff_dB = 36;
  L1_rx_thread_core = 17;
  L1_tx_thread_core = 18;
  phase_compensation = 0; # needs to match O-RU configuration
}
);

RUs = (
{
  local_rf       = "no";
  nb_tx          = 4;
  nb_rx          = 4;
  att_tx         = 0;
  att_rx         = 0;
  bands          = [77];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75;
  sf_extension                  = 0;
  eNB_instances  = [0];
  ru_thread_core = 16;
  sl_ahead       = 5;
  tr_preference  = "raw_if4p5"; # important: activate FHI7.2
  do_precoding   = 0; # needs to match O-RU configuration
}
);

fhi_72 = {
  # OAI built-in-L1 DU on aerial00 VF0/VF1. ru_addr = O-RU VF MAC (RU_MAC in
  # setup_ru_ifs-gh200.sh). Values match the setup script defaults; only change if overridden.
  dpdk_devices = ("0000:01:00.3", "0000:01:00.4");
  system_core = 13;
  io_core = 14;
  worker_cores = (15);
  ru_addr = ("02:00:00:00:00:7b", "02:00:00:00:00:7b");
  file_prefix = "gnb";
  mtu = 9600;
  fh_config = ({
    T1a_cp_dl = (285, 470);
    T1a_cp_ul = (285, 429);
    T1a_up = (300, 450);
    Ta4 = (400, 440);
    ru_config = {
      iq_width = 16;
      iq_width_prach = 16;
    };
  });
};
