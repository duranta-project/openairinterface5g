# gNB as a FAPI VNF against Aerial cuPHY L1 — 4TR geometry (docker-compose.4TR.yml).
# Cell / AMF / security / log live in the shared 4TR common include.

nfapi = "AERIAL";

@include "gnb.sa.band77.gh200.common.4TR.conf"

MACRLCs = (
{
  num_cc                      = 1;
  # FAPI transport to the Aerial cuPHY L1 over nvIPC shared memory.
  # local_s/remote_s addresses and ports are nfapi placeholders (transport is SHM).
  remote_s_address            = "127.0.0.1"; // pnf (L1) addr
  local_s_address             = "127.0.0.2"; // vnf (gNB) addr
  local_s_portc               = 50001;
  remote_s_portc              = 50000;
  local_s_portd               = 50011;
  remote_s_portd              = 50010;
  tr_s_preference             = "aerial";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 200;
  pucch_TargetSNRx10          = 200;
  ul_bler_target_upper        = .35;
  ul_bler_target_lower        = .15;
  pusch_FailureThres          = 100;
}
);
